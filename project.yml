name: FrameBar
options:
  bundleIdPrefix: app.italianseasoning
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGNING_ALLOWED: NO
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  FrameBar:
    type: application
    platform: macOS
    sources: [FrameBar]
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.italianseasoning.FrameBar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: FrameBar/Info.plist
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: FrameBar reads Roblox's visible FPS stats locally. Images are never saved or uploaded.
        INFOPLIST_KEY_CFBundleDisplayName: FrameBar
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FrameBarTests:
    type: bundle.unit-test
    platform: macOS
    sources: [FrameBarTests]
    dependencies:
      - target: FrameBar
schemes:
  FrameBar:
    build:
      targets:
        FrameBar: all
    test:
      targets: [FrameBarTests]
